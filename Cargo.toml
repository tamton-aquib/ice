[package]
name = "ice"
version = "0.4.0"
edition = "2021"
authors = ["tamton-aquib <aquibjavedt007@gmail.com>"]
license = "MIT"
description = "A simple CTF tool store"
homepage = "https://github.com/tamton-aquib/ice"
repository = "https://github.com/tamton-aquib/ice"
readme = "README.md"
keywords = ["ctf", "pwnable", "security", "hacking"]


[dependencies]
anyhow = "1"
hex = "0.4.3"
base64 = "0.22"
base32 = "0.4"
regex = "1.6"
urlencoding = "2.1.3"
ureq = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
digest = "0.10.7"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
bs58 = "0.5"
base45 = "3.2"
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
